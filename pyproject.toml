[project]
name = "planner"
version = "10.0.0"
description = "Universal Data Engineering Service — task aggregation, reporting & AI analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
ai = [
    "litellm>=1.50",
]
all = [
    "planner[api,ai]",
]

[project.scripts]
planner-api = "uvicorn:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
